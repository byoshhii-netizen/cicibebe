<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CiciBebe Admin</title>
  <style>
    :root {
      --bg: #1d0d2a;
      --panel: rgba(255,255,255,0.08);
      --panel-strong: rgba(255,255,255,0.12);
      --text: #fff7ff;
      --muted: rgba(255,255,255,0.7);
      --input: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.14);
      --pink: #f9d5ff;
      --blue: #dfe5ff;
      --shadow: rgba(0,0,0,0.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1d0d2a 0%, #3f1d4a 42%, #6b2e72 100%);
      color: var(--text);
    }

    body {
      padding: 28px 18px 40px;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      background: rgba(21, 10, 30, 0.52);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 28px 60px var(--shadow);
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.1rem);
    }

    .header a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
    }

    .content {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 24px;
      padding: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.1rem;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .field input, .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--input);
      border-radius: 14px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 1rem;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 18px;
      margin-top: 8px;
    }

    .people-editor { display: grid; gap: 14px; margin-top: 8px; }
    .person-editor { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
    .person-editor-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .person-editor-head h3 { margin: 0; font-size: 1rem; }
    .person-remove { border: 1px solid rgba(255,120,150,0.35); border-radius: 10px; padding: 6px 9px; color: #ffd0df; background: rgba(255,100,145,0.1); cursor: pointer; }
    .add-person { border: 1px dashed rgba(255,229,154,0.5); border-radius: 12px; padding: 10px; color: #ffe59a; background: rgba(255,229,154,0.06); cursor: pointer; font: inherit; font-weight: 800; }

    .button-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .button-card h3 {
      margin: 0 0 14px;
      font-size: 1rem;
    }

    .small-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .preview-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .preview-button {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-weight: 800;
      color: rgba(27, 18, 30, 0.8);
      box-shadow: 0 18px 28px rgba(0,0,0,0.2);
      font-size: 0.9rem;
    }

    .preview-button .emoji {
      font-size: 2rem;
      line-height: 1;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
    }

    button[type="submit"], .secondary {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 0.96rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button[type="submit"] {
      background: linear-gradient(135deg, #f9d5ff, #dfe5ff);
      color: #2d123e;
      font-weight: 800;
    }

    .secondary {
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }

    button:hover {
      transform: translateY(-1px);
    }

    .status {
      min-height: 22px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .logs-panel { grid-column: 1 / -1; }
    .log-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .log-table th, .log-table td { padding: 9px 7px; border-bottom: 1px solid var(--border); text-align: left; }
    .log-table th { color: var(--muted); font-weight: 600; }
    .log-type { color: #ffe59a; font-weight: 700; }

    @media (max-width: 760px) {
      .content {
        grid-template-columns: 1fr;
      }

      .button-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>💖 CiciBebe Admin</h1>
      <a href="/">Siteye dön</a>
    </div>

    <div class="content">
      <section class="panel">
        <h2>Genel Ayarlar</h2>

        <form id="settingsForm">
          <div class="field">
            <label for="pageTitle">Başlık</label>
            <input id="pageTitle" type="text" value="CiciBebe" />
          </div>

          <div class="field">
            <label for="pageSubtitle">Alt Başlık</label>
            <input id="pageSubtitle" type="text" value="" />
          </div>

          <div class="field">
            <label for="rankStep">Rank başına gereken tıklama</label>
            <input id="rankStep" type="number" min="1" step="1" value="12" />
          </div>

          <div class="field">
            <label for="backgroundColor">Site arka plan rengi</label>
            <input id="backgroundColor" type="color" value="#2a0d35" />
          </div>

          <div id="peopleEditor" class="people-editor"></div>
          <button type="button" class="add-person" id="addPerson"><i class="fas fa-user-plus"></i> Yeni kişi ekle</button>

          <div class="actions">
            <button type="button" class="secondary" id="resetBtn">Sıfırla</button>
            <button type="submit">Ayarları Kaydet</button>
          </div>
        </form>

        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>Önizleme</h2>
        <div class="preview-box">
          <div id="previewTitle" style="font-size:1.4rem; font-weight:800; text-align:center;">CiciBebe</div>
          <div id="previewSubtitle" style="text-align:center; color: var(--muted);"></div>
          <div class="preview-button" id="previewButton1" style="background:#f9d5ff;">
            <span class="emoji">✨</span>
            <span>Belinay</span>
          </div>
          <div class="preview-button" id="previewButton2" style="background:#dfe5ff;">
            <span class="emoji">💫</span>
            <span>İso</span>
          </div>
        </div>
      </section>

      <section class="panel logs-panel">
        <h2>Gerçek giriş ve tıklama kayıtları</h2>
        <div id="logsStatus" class="status">Yükleniyor...</div>
        <div style="overflow:auto"><table class="log-table"><thead><tr><th>Tür</th><th>Kişi</th><th>Saat</th><th>IP</th><th>Detay</th></tr></thead><tbody id="logsBody"></tbody></table></div>
      </section>
    </div>
  </div>

  <script>
    const defaults = {
      title: 'CiciBebe',
      subtitle: '',
      buttons: [
        { id: 'belinay', label: 'Belinay', emoji: '✨', color: '#f9d5ff', image: '', count: 0, lastClickedAt: null },
        { id: 'iso', label: 'İso', emoji: '💫', color: '#dfe5ff', image: '', count: 0, lastClickedAt: null }
      ],
      backgroundColor: '#2a0d35'
    };

    let people = [];

    function escHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[character]));
    }

    const form = document.getElementById('settingsForm');
    const statusEl = document.getElementById('status');
    const titleInput = document.getElementById('pageTitle');
    const subtitleInput = document.getElementById('pageSubtitle');
    const rankStepInput = document.getElementById('rankStep');
    const backgroundColor = document.getElementById('backgroundColor');

    function makeId(label) {
      const base = String(label || 'kisi').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'kisi';
      let id = base;
      let index = 2;
      while (people.some((person) => person.id === id)) id = `${base}-${index++}`;
      return id;
    }

    function renderPeopleEditor() {
      document.getElementById('peopleEditor').innerHTML = people.map((person, index) => `
        <div class="person-editor" data-person-index="${index}">
          <div class="person-editor-head"><h3>${person.label || `Kişi ${index + 1}`}</h3>${people.length > 2 ? `<button type="button" class="person-remove" data-remove-person="${index}"><i class="fas fa-trash"></i> Sil</button>` : ''}</div>
          <div class="field"><label>Girişte yazılacak isim</label><input data-field="label" type="text" value="${escHtml(person.label || '')}" required /></div>
          <div class="small-row"><div class="field"><label>Emoji</label><input data-field="emoji" type="text" maxlength="4" value="${escHtml(person.emoji || '💖')}" /></div><div class="field"><label>Renk</label><input data-field="color" type="color" value="${/^#[0-9a-f]{6}$/i.test(person.color) ? person.color : '#f9d5ff'}" /></div></div>
          <div class="field"><label>Foto URL</label><input data-field="image" type="url" value="${escHtml(person.image || '')}" placeholder="https://..." /></div>
          <div class="field"><label>Toplam tıklama</label><input data-field="count" type="number" min="0" step="1" value="${Number(person.count || 0)}" /></div>
        </div>`).join('');
      document.querySelectorAll('[data-remove-person]').forEach((button) => button.addEventListener('click', () => {
        people.splice(Number(button.dataset.removePerson), 1);
        renderPeopleEditor();
      }));
    }

    function collectPeople() {
      return [...document.querySelectorAll('.person-editor')].map((editor, index) => {
        const old = people[index] || {};
        const value = (field) => editor.querySelector(`[data-field="${field}"]`).value;
        return { ...old, id: old.id || makeId(value('label')), label: value('label').trim(), emoji: value('emoji') || '💖', color: value('color') || '#f9d5ff', image: value('image').trim(), count: Math.max(0, Number(value('count')) || 0) };
      });
    }

    function updatePreview() {
      document.getElementById('previewTitle').textContent = titleInput.value || 'CiciBebe';
      document.getElementById('previewSubtitle').textContent = subtitleInput.value || '';
      const preview1 = document.getElementById('previewButton1');
      const preview2 = document.getElementById('previewButton2');
      const first = people[0] || defaults.buttons[0];
      const second = people[1] || defaults.buttons[1];
      preview1.style.background = first.color || '#f9d5ff';
      preview2.style.background = second.color || '#dfe5ff';
      preview1.innerHTML = `<span class="emoji">${escHtml(first.emoji || '✨')}</span><span>${escHtml(first.label || 'Belinay')}</span>`;
      preview2.innerHTML = `<span class="emoji">${escHtml(second.emoji || '💫')}</span><span>${escHtml(second.label || 'İso')}</span>`;
    }

    async function loadSettings() {
      try {
        const response = await fetch('/api/cicibebe/settings');
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Ayarlar yüklenemedi');
        }

        const settings = data.settings || defaults;
        titleInput.value = settings.title || defaults.title;
        subtitleInput.value = settings.subtitle || defaults.subtitle;
        rankStepInput.value = settings.rankStep || 12;
        backgroundColor.value = settings.backgroundColor || '#2a0d35';
        people = (settings.buttons?.length ? settings.buttons : defaults.buttons).map((person) => ({ ...person }));
        renderPeopleEditor();
        updatePreview();
      } catch (error) {
        statusEl.textContent = error.message;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusEl.textContent = 'Kaydediliyor...';

      const payload = {
        title: titleInput.value.trim() || defaults.title,
        subtitle: '',
        rankStep: Math.max(1, Number(rankStepInput.value) || 12),
        backgroundColor: backgroundColor.value || '#2a0d35',
        buttons: collectPeople()
      };
      if (payload.buttons.length < 2 || payload.buttons.some((person) => !person.label)) { statusEl.textContent = 'En az iki kişinin adı dolu olmalı.'; return; }

      try {
        const response = await fetch('/api/cicibebe/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Kaydetme başarısız');
        }

        statusEl.textContent = 'Ayarlar kaydedildi. Site anında güncellendi.';
        updatePreview();
      } catch (error) {
        statusEl.textContent = error.message;
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      titleInput.value = defaults.title;
      subtitleInput.value = defaults.subtitle;
      backgroundColor.value = '#2a0d35';
      people = defaults.buttons.map((person) => ({ ...person }));
      renderPeopleEditor();
      updatePreview();
      statusEl.textContent = 'Varsayılan ayarlar yüklendi.';
    });

    document.getElementById('addPerson').addEventListener('click', () => {
      people.push({ id: makeId('Yeni Kişi'), label: 'Yeni Kişi', emoji: '💖', color: '#f9d5ff', image: '', count: 0 });
      renderPeopleEditor();
    });

    async function loadLogs() {
      const status = document.getElementById('logsStatus');
      try {
        const response = await fetch('/api/cicibebe/logs');
        const data = await response.json();
        const entries = data.entries || [];
        document.getElementById('logsBody').innerHTML = entries.map((entry) => {
          const type = entry.type === 'login' ? 'Giriş' : 'Tıklama';
          const detail = entry.type === 'login' ? 'Oturum açıldı' : `${entry.count || 0}. tıklama`;
          return `<tr><td class="log-type">${type}</td><td>${entry.player || '-'}</td><td>${entry.when ? new Date(entry.when).toLocaleString('tr-TR') : '-'}</td><td>${entry.ip || '-'}</td><td>${detail}</td></tr>`;
        }).join('') || '<tr><td colspan="5">Henüz kayıt yok.</td></tr>';
        status.textContent = `${entries.length} kayıt gösteriliyor.`;
      } catch (error) { status.textContent = 'Loglar yüklenemedi.'; }
    }

    loadSettings();
    loadLogs();
  </script>
</body>
</html>
