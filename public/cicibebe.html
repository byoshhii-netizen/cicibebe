<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2d123e" />
  <title>CiciBebe</title>
  <style>
    :root {
      --bg-1: #2a0d35;
      --bg-2: #4b1d5c;
      --bg-3: #6a2d73;
      --panel: rgba(255,255,255,0.12);
      --panel-strong: rgba(255,255,255,0.18);
      --text: #fff7ff;
      --muted: rgba(255,255,255,0.75);
      --shadow: rgba(26, 8, 31, 0.45);
      --pink: #f9d5ff;
      --blue: #dfe5ff;
      --glow: rgba(255,255,255,0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 30%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 42%, var(--bg-3) 100%);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px 50px;
    }

    .page-shell {
      position: relative;
      width: min(100%, 980px);
      min-height: min(90vh, 820px);
      border-radius: 32px;
      padding: 28px 20px 24px;
      background: rgba(28, 11, 39, 0.32);
      box-shadow: 0 30px 80px var(--shadow);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      overflow: hidden;
      isolation: isolate;
    }

    .page-shell::before,
    .page-shell::after {
      content: "";
      position: absolute;
      inset: auto;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      filter: blur(18px);
      z-index: -1;
      animation: floatBlob 12s ease-in-out infinite alternate;
    }

    .page-shell::before {
      top: -120px;
      left: -70px;
    }

    .page-shell::after {
      right: -20px;
      bottom: -120px;
      animation-delay: 5s;
    }

    @keyframes floatBlob {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(22px) scale(1.08); }
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand-chip {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.05);
      border-radius: 999px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }


    .hero {
      text-align: center;
      margin: 12px auto 26px;
      max-width: 700px;
    }

    .title {
      margin: 0;
      font-size: clamp(2.4rem, 4vw, 4.6rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
      text-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .subtitle {
      margin: 12px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.5vw, 1.3rem);
      max-width: 580px;
    }

    .vote-wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 24px;
      margin-top: 14px;
    }

    .vote-card {
      position: relative;
      min-height: 390px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 30px;
      background: rgba(255,255,255,0.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 25px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 18px 18px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }

    .vote-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 24px 50px rgba(18, 7, 26, 0.3);
    }

    .vote-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 25%, rgba(255,255,255,0.04));
      pointer-events: none;
    }

    .vote-card .media {
      position: relative;
      width: min(220px, 60vw);
      height: min(220px, 44vw);
      border-radius: 28px;
      overflow: hidden;
      background: rgba(255,255,255,0.1);
      display: grid;
      place-items: center;
      box-shadow: 0 14px 34px rgba(0,0,0,0.22);
      z-index: 1;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .vote-card .media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.08);
    }

    .vote-card .media .fallback {
      font-size: clamp(3.2rem, 7vw, 5.2rem);
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
    }

    .vote-button {
      width: min(210px, 70vw);
      height: min(210px, 70vw);
      max-width: 210px;
      max-height: 210px;
      border-radius: 50%;
      border: none;
      box-shadow: 0 18px 32px rgba(0,0,0,0.2), inset 0 2px 10px rgba(255,255,255,0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: clamp(1.05rem, 1.6vw, 1.3rem);
      color: rgba(32, 18, 38, 0.85);
      font-weight: 800;
      cursor: pointer;
      position: relative;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      z-index: 1;
      user-select: none;
      padding: 0 12px;
      text-align: center;
    }

    .vote-button:active {
      transform: scale(0.97);
    }

    .vote-button::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      opacity: 0.8;
    }

    .vote-button .emoji {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      line-height: 1;
    }

    .vote-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 16px;
      gap: 12px;
      z-index: 1;
    }

    .count-pill {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      color: var(--text);
      backdrop-filter: blur(6px);
      font-size: 0.95rem;
    }

    .last-label {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: right;
    }

    .status-bar {
      margin-top: 22px;
      text-align: center;
      color: rgba(255,255,255,0.8);
      font-size: 0.92rem;
      min-height: 22px;
      padding: 0 10px;
    }

    .status-bar strong {
      color: #fff;
    }

    .name-gate {
      position: fixed;
      inset: 0;
      background: rgba(19, 8, 25, 0.72);
      backdrop-filter: blur(8px);
      display: grid;
      place-items: center;
      z-index: 100;
      padding: 20px;
    }

    .name-gate.hidden {
      display: none;
    }

    .name-card {
      width: min(420px, 100%);
      background: rgba(31, 16, 40, 0.9);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 24px;
      padding: 24px 22px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.28);
      text-align: center;
    }

    .name-card h2 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
    }

    .name-card p {
      margin: 0 0 20px;
      color: rgba(255,255,255,0.72);
    }

    .name-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .name-form input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
    }

    .name-form button {
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #f9d5ff, #dfe5ff);
      color: #2d123e;
    }

    .name-form button:hover {
      transform: translateY(-1px);
    }

    .vote-button:disabled {
      opacity: 0.34;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none;
    }

    .vote-button:disabled::before {
      opacity: 0.5;
    }

    @media (max-width: 680px) {
      body {
        padding: 16px 12px 32px;
      }

      .page-shell {
        min-height: 100vh;
        width: 100%;
        border-radius: 22px;
        padding: 20px 14px 18px;
      }

      .topbar {
        margin-bottom: 10px;
      }

      .vote-wrap {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .vote-card {
        min-height: 300px;
        padding: 16px 14px 14px;
      }

      .vote-button {
        width: min(170px, 62vw);
        height: min(170px, 62vw);
      }

      .vote-meta {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="nameGate" class="name-gate">
    <div class="name-card">
      <h2>Adın nedir?</h2>
      <form id="nameForm" class="name-form">
        <input id="playerNameInput" type="text" maxlength="40" placeholder="İsmini yaz..." autocomplete="off" />
        <button type="submit">Devam et</button>
      </form>
    </div>
  </div>

  <div class="page-shell">
    <div class="topbar">
      <div class="brand-chip">💖 CiciBebe</div>
    </div>

    <header class="hero">
      <h1 id="pageTitle" class="title">CiciBebe</h1>
      <p id="pageSubtitle" class="subtitle">Sevgiyle büyüyen anlar</p>
    </header>

    <main class="vote-wrap" id="voteWrap" aria-live="polite"></main>

    <div class="status-bar" id="statusBar">İlk tıklamanı sen yap!</div>
  </div>

  <script>
    const state = {
      title: 'CiciBebe',
      subtitle: 'Sevgiyle büyüyen anlar',
      buttons: [],
      lastClicked: null,
      playerName: ''
    };

    const voteWrap = document.getElementById('voteWrap');
    const titleEl = document.getElementById('pageTitle');
    const subtitleEl = document.getElementById('pageSubtitle');
    const statusBar = document.getElementById('statusBar');
    const nameGate = document.getElementById('nameGate');
    const nameForm = document.getElementById('nameForm');
    const playerNameInput = document.getElementById('playerNameInput');

    function normalizeName(value) {
      return String(value || '')
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/ı/g, 'i')
        .replace(/İ/g, 'i')
        .replace(/[^a-z]/g, '');
    }

    function resolveAllowedButton(name) {
      const normalized = normalizeName(name);
      if (normalized === 'belinay') return 'belinay';
      if (normalized === 'iso') return 'iso';
      return null;
    }

    function getPlayerName() {
      const saved = localStorage.getItem('cicibebe-player-name');
      return saved ? saved.trim() : '';
    }

    function setPlayerName(name) {
      state.playerName = name;
      localStorage.setItem('cicibebe-player-name', name.trim());
      nameGate.classList.add('hidden');
      playerNameInput.value = '';
    }

    function logoutPlayer() {
      state.playerName = '';
      localStorage.removeItem('cicibebe-player-name');
      nameGate.classList.remove('hidden');
      statusBar.textContent = 'İlk tıklamanı sen yap!';
      playerNameInput.focus();
    }

    function ensureGate() {
      const name = getPlayerName();
      const allowed = resolveAllowedButton(name);
      if (!name || !allowed) {
        state.playerName = name || '';
        nameGate.classList.remove('hidden');
        if (name) {
          statusBar.textContent = 'Geçersiz isim. Lütfen sadece Belinay veya Iso gir.';
        } else {
          statusBar.textContent = 'İlk tıklamanı sen yap!';
        }
        return false;
      }

      state.playerName = name;
      nameGate.classList.add('hidden');
      return true;
    }

    function formatTime(iso) {
      if (!iso) return 'Henüz tıklanmadı';
      const date = new Date(iso);
      return new Intl.DateTimeFormat('tr-TR', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      }).format(date);
    }

    function render() {
      titleEl.textContent = state.title || 'CiciBebe';
      subtitleEl.textContent = state.subtitle || 'Sevgiyle büyüyen anlar';

      voteWrap.innerHTML = '';
      const allowed = resolveAllowedButton(state.playerName);

      state.buttons.forEach((button) => {
        const card = document.createElement('div');
        card.className = 'vote-card';

        const media = document.createElement('div');
        media.className = 'media';

        if (button.image) {
          const img = document.createElement('img');
          img.src = button.image;
          img.alt = button.label;
          img.loading = 'eager';
          media.appendChild(img);
        } else {
          const fallback = document.createElement('div');
          fallback.className = 'fallback';
          fallback.textContent = button.emoji || '💖';
          media.appendChild(fallback);
        }

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'vote-button';
        btn.style.background = button.color || '#f9d5ff';
        btn.innerHTML = `<span class="emoji">${button.emoji || '💖'}</span><span>${button.label || 'Buton'}</span>`;
        btn.setAttribute('aria-label', `${button.label} butonuna tıklama yap`);

        const isAllowedThisButton = !!allowed && allowed === button.id;
        btn.disabled = !isAllowedThisButton;
        btn.title = isAllowedThisButton ? `Sen bu butona basabilirsin` : 'Bu tuşa yetkin yok';
        btn.addEventListener('click', () => vote(button.id));

        const meta = document.createElement('div');
        meta.className = 'vote-meta';

        const count = document.createElement('div');
        count.className = 'count-pill';
        count.textContent = `${button.count || 0} tıklama`;

        const last = document.createElement('div');
        last.className = 'last-label';
        last.textContent = button.lastClickedAt ? `Son: ${formatTime(button.lastClickedAt)}` : 'Henüz yok';

        meta.appendChild(count);
        meta.appendChild(last);

        card.appendChild(media);
        card.appendChild(btn);
        card.appendChild(meta);
        voteWrap.appendChild(card);
      });

      if (state.lastClicked && state.lastClicked.label) {
        statusBar.innerHTML = `<strong>${state.lastClicked.label}</strong> en son ${formatTime(state.lastClicked.time)} tarihinde tıkladı.`;
      } else if (!state.playerName || !resolveAllowedButton(state.playerName)) {
        statusBar.textContent = 'İlk tıklamanı sen yap!';
      } else if (resolveAllowedButton(state.playerName) === 'belinay') {
        statusBar.textContent = 'Belinay olarak tıklama hakkın açık.';
      } else {
        statusBar.textContent = 'Iso olarak tıklama hakkın açık.';
      }
    }

    async function loadSettings() {
      try {
        const response = await fetch('/api/cicibebe/settings');
        const data = await response.json();
        if (data.success && data.settings) {
          state.title = data.settings.title || state.title;
          state.subtitle = data.settings.subtitle || state.subtitle;
          state.buttons = data.settings.buttons || [];
          state.lastClicked = data.settings.lastClicked || null;
          render();
        }
      } catch (error) {
        console.error('Ayarlar alınamadı', error);
      }
    }

    async function vote(buttonId) {
      const allowedButton = resolveAllowedButton(state.playerName);
      if (!allowedButton || allowedButton !== buttonId) {
        statusBar.textContent = 'Bu tuşa basma yetkin yok.';
        return;
      }

      try {
        const response = await fetch('/api/cicibebe/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ buttonId, name: state.playerName })
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Tıklama kaydı yapılamadı');
        }

        state.buttons = data.settings.buttons || state.buttons;
        state.lastClicked = data.settings.lastClicked || state.lastClicked;
        render();
      } catch (error) {
        statusBar.textContent = error.message || 'Bir hata oluştu';
      }
    }

    nameForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const entered = playerNameInput.value.trim();
      const allowed = resolveAllowedButton(entered);

      if (!allowed) {
        statusBar.textContent = 'Lütfen sadece Belinay veya Iso yaz.';
        playerNameInput.focus();
        return;
      }

      setPlayerName(entered);
      loadSettings();
    });

    const logoutButton = document.createElement('button');
    logoutButton.type = 'button';
    logoutButton.textContent = 'Çıkış';
    logoutButton.style.cssText = 'margin-top: 16px; padding: 10px 16px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05); color: white; border-radius: 999px; cursor: pointer;';
    logoutButton.addEventListener('click', logoutPlayer);
    document.querySelector('.page-shell').appendChild(logoutButton);

    if (getPlayerName()) {
      state.playerName = getPlayerName();
      nameGate.classList.add('hidden');
    } else {
      ensureGate();
    }

    loadSettings();
  </script>
</body>
</html>
